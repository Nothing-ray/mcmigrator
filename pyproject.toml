[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmig"
version = "0.13.1"
description = "Minecraft 整合包版本迁移工具:扫描/比对/计划/执行/换包/向导界面"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "PyYAML>=6.0",
    "pathspec>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
mcmig = "migration.cli:main"
mcmig-gui = "migration.gui.app:main"

[project.optional-dependencies]
# 窗口壳可选组(spec §4.1.2/D5):默认安装=CLI+浏览器模式;
# 打包与想要独立窗口的源码用户 `pip install -e ".[gui]"`。
# >=5.0 钉版承担 selected_renderer 消费内部 API(webview.guilib.initialize)
# 的风险;代码路径内 lazy import,未安装时自动降级浏览器模式(测试零依赖它)
gui = ["pywebview>=5.0"]
# 开发/测试依赖组:r11 教训 —— `uv sync` 精确模式只装运行时依赖会剪掉 pytest,
# 测试环境请用 `uv pip install -e ".[dev]"`(或 pip 等价命令)
dev = ["pytest>=8.0", "ruff==0.15.20"]

[tool.setuptools.packages.find]
include = ["migration*"]

[tool.setuptools.package-data]
# manifest.sha256(数据完整性清单)须随包分发,doctor 校验依赖它;
# README.txt 为数据目录说明(不参与清单校验),一并随包分发;
# gui/index.html 为向导页面(终审 I-2:不入 package-data 时非 editable 安装
# GET / 会静默降级占位页),模式相对 migration 包根匹配 gui/ 子目录
migration = ["data/*.yaml", "data/*.sha256", "data/*.txt", "gui/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
