# 非约定式 config→modid 映射覆盖表
# 约定: config/<modid>* 或 config/<modid>/* → modid (自动匹配)
# 此表仅列不遵循约定的例外
version: 1
mappings:
  - match: "config/xaero/**"
    modid: "xaerominimap"
    reason: "目录名 xaero ≠ modid xaerominimap"
  - match: "config/xaerohud.txt"
    modid: "xaerominimap"
    reason: "文件名无 modid 前缀特征"
  - match: "config/xaeropatreon.txt"
    modid: "xaerominimap"
    reason: "同上"
  - match: "config/dragon-survival/**"
    modid: "dragonsurvival"
    reason: "目录名 dragon-survival 含连字符,正则拒绝 → extract 返回 None;真实 modid 为 dragonsurvival(无分隔符)"
  # --- 以下为 modswap-830 观察(2026-08-31)实测的 B 类映射:config 文件名 ≠ modid ---
  - match: "config/fetzis_displays/**"
    modid: "fetzisdisplays"
    reason: "目录名带下划线,真实 modid fetzisdisplays 无分隔符(248 顶层 jar 实测)"
  - match: "config/gun_scaling/**"
    modid: "scguns"
    reason: "config 目录名 gun_scaling 与 modid scguns(ScorchedGuns)完全不同"
  - match: "config/resourceful-config-web.json"
    modid: "resourcefulconfig"
    reason: "文件名前缀 resourceful-,真实 modid resourcefulconfig(内嵌于 kaleidoscope_compat)"
  - match: "config/l2configs/**"
    modid: "l2core"
    reason: "L2 库族(l2core/l2harvester 等)共享的配置目录,映射到 l2core(内嵌于 youkaisfeasts)"
