# 内置默认规则(最低优先级)。简写形式:类别 -> glob 列表。
never:
  - _conflict_backup/**               # executor 冲突备份(spec §2.1:不迁不删,首份=目标原始值)
  - logs/**
  - crash-reports/**
  - hs_err_pid*.log                 # JVM 崩溃转储(五/六轮语料实测落根目录,无迁移价值;F18)
  - replay_pid*.log                 # JVM 崩溃回放记录(同上)
  - "<ver>.jar"
  - "<ver>.json"
  - "<ver>-natives/**"
  - PCL/**
  - downloads/**
  - patchouli_books/**
  - patchouli_data.json
  - usercache.json
  - observable_announce
  - command_history.txt
  - createcinema/**                   # Create Cinema 的 ffmpeg native-cache(可重建;modswap-830 观察)
  - defaultconfigs/**
  - "**/cache/**"
  - config/jei/world/**                    # JEI 查询历史(运行时可重建)
  - config/ars_nouveau/search_index/**     # Lucene 索引(运行时可重建)
  - mods_*/**                         # 服务端运维回滚备份目录(mods_9.4_旧/ 等,非玩家状态;F5)
                                      # 客户端版本文件夹内无此形态,不命中
  - "**/*.bak"                        # 任何目录下的 .bak(不限 config;-N 世代累积的备份标记物;
                                      # F28):本体一律不迁。本条目在 never: 段内,与 must_migrate:
                                      # 同为顶级段,按首命中优先压过 saves/** 等(never 段先于 must_migrate);
                                      # 判定法父提升不受影响(planner 读快照全集,.bak 只当改动标记);
                                      # 用户规则层级更高,可覆盖本行把特定 .bak 提回 pass-2 机制
must_migrate:
  - options.txt
  - servers.dat
  - servers.dat_old
  - saves/**
  - schematics/**
  - xaero/**
  - XaeroWaypoints_*/**
  - local/ftbchunks/**
  - Distant_Horizons_server_data/**
  - dragon-survival/**
  # ---- 服务端场景(F1, 2026-09 服务端实测语料: world+配置全落 candidate 致 to_migrate=0)----
  # 专用服务器无 versions/ 结构,整目录即"版本";客户端目录无以下路径,永不命中
  - world/**                          # 服务端世界与全部玩家进度(含 DIM-1/DIM1/entities)
  - world_nether/**                   # Bukkit 系下界维度(旧版命名兼容)
  - world_the_end/**                  # Bukkit 系末地维度(旧版命名兼容)
  - server.properties                 # 端口/种子/MOTD/白名单开关,丢失不可逆
  - whitelist.json                    # 白名单
  - ops.json                          # 管理员列表与权限等级
  - banned-*.json                     # banned-ips / banned-players 封禁列表
