# 内置默认规则(最低优先级)。简写形式:类别 -> glob 列表。
never:
  - _conflict_backup/**               # executor 冲突备份(spec §2.1:不迁不删,首份=目标原始值)
  - logs/**
  - crash-reports/**
  - "<ver>.jar"
  - "<ver>.json"
  - "<ver>-natives/**"
  - PCL/**
  - downloads/**
  - patchouli_books/**
  - patchouli_data.json
  - usercache.json
  - observable_announce
  - command_history.txt
  - createcinema/**                   # Create Cinema 的 ffmpeg native-cache(可重建;modswap-830 观察)
  - defaultconfigs/**
  - "**/cache/**"
  - config/jei/world/**                    # JEI 查询历史(运行时可重建)
  - config/ars_nouveau/search_index/**     # Lucene 索引(运行时可重建)
must_migrate:
  - options.txt
  - servers.dat
  - servers.dat_old
  - saves/**
  - schematics/**
  - xaero/**
  - XaeroWaypoints_*/**
  - local/ftbchunks/**
  - Distant_Horizons_server_data/**
  - dragon-survival/**
